<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mango realtime collaboration browser harness</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; }
      #identity { font-weight: 700; margin-bottom: 16px; }
      #controls { display: grid; gap: 12px; margin-bottom: 20px; }
      form, .actions { align-items: end; border: 1px solid #ccc; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; }
      label { display: grid; font-size: 12px; gap: 4px; }
      textarea { height: 70px; min-width: 360px; }
      #editors { display: grid; gap: 12px; }
      [contenteditable="true"] { border: 1px solid #888; min-height: 80px; padding: 12px; }
      #harness-events { background: #111; color: #eee; max-height: 240px; overflow: auto; padding: 12px; white-space: pre-wrap; }
      #harness-status { font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Realtime collaboration browser harness</h1>
    <div id="identity"></div>
    <section id="controls">
      <form id="mount-form">
        <label>Editor ID <input id="mount-id" value="editor-a" /></label>
        <label>Resource type
          <select id="resource-type">
            <option value="node">Node</option>
            <option value="logic_gate">Logic Gate</option>
            <option value="project">Project</option>
          </select>
        </label>
        <label>Resource ID <input id="resource-id" value="resource-1" /></label>
        <label>Document ID <input id="document-id" value="document-1" /></label>
        <button type="submit" data-testid="mount">Mount editor</button>
      </form>
      <form id="edit-form">
        <label>Editor ID <input id="edit-id" value="editor-a" /></label>
        <label>HTML <textarea id="edit-html"></textarea></label>
        <label>Delivery mode
          <select id="edit-mode">
            <option value="ack_before_broadcast">Ack before broadcast</option>
            <option value="broadcast_before_ack">Broadcast before ack</option>
            <option value="duplicate">Duplicate broadcast</option>
            <option value="no_broadcast">No broadcast</option>
            <option value="lost_ack_after_commit">Lost acknowledgement</option>
          </select>
        </label>
        <button type="submit" data-testid="edit">Commit edit</button>
      </form>
      <div class="actions">
        <label>User ID <input id="permission-user" value="browser-user-a" /></label>
        <label>Permission <select id="permission-value"><option value="edit">Edit</option><option value="no_access">No access</option></select></label>
        <button id="permission-button" data-testid="permission">Set permission</button>
        <button id="dispose-button" data-testid="dispose">Dispose editor</button>
        <label>Event index <input id="event-index" type="number" value="-1" /></label>
        <button id="broadcast-button" data-testid="broadcast">Broadcast latest</button>
        <button id="gap-button" data-testid="gap">Emit revision gap</button>
        <button id="reconnect-button" data-testid="reconnect">Reconnect</button>
        <button id="reset-button" data-testid="reset">Reset</button>
      </div>
      <output id="harness-status">idle</output>
    </section>
    <div id="editors"></div>
    <h2>Recent transport events</h2>
    <pre id="harness-events"></pre>
    <script type="module" src="/src/testing/editorCollaborationBrowserHarness.ts"></script>
  </body>
</html>
