name: MangoRTS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mangorts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres17:
        image: postgres:17.7
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      EMAIL_SQS_POSTGRES17_HOST: 127.0.0.1
      EMAIL_SQS_POSTGRES17_PORT: "5432"
      EMAIL_SQS_POSTGRES17_DATABASE: postgres
      EMAIL_SQS_POSTGRES17_USER: postgres
      EMAIL_SQS_POSTGRES17_PASSWORD: postgres
      MANGORTS_EMAIL_SQS_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          echo "POSTGRES_BIN=$(dirname "$(command -v psql)")" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run repo tests
        run: node scripts/run_all_tests.mjs
